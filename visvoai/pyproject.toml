[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visvoai"
version = "0.1.0"
description = "VisvoAI — installs the visvoai terminal coding agent (meta-package)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VisvoAI", email = "akshant.jain2@gmail.com" }]
requires-python = ">=3.11"
# Floor, not a pin: this meta-package exists so `pip install visvoai` gets a
# real CLI. Unfloored, it resolves against whatever is on the index — which
# would have included the 0.0.1 placeholder. The floor tracks the CLI version
# current at each meta release; it never needs an upper bound.
dependencies = ["visvoai-cli>=0.14.4"]

[project.urls]
Homepage = "https://visvoai.com"
Repository = "https://github.com/VisvoAI/visvoai"

[tool.setuptools]
packages = []
