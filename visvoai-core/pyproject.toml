[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visvoai-core"
version = "0.4.0"
description = "VisvoAI — Extensible Python agent runtime with tool calling and semantic tool retrieval"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VisvoAI", email = "akshant.jain2@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.2",
]

[project.urls]
Homepage = "https://visvoai.com"
Repository = "https://github.com/VisvoAI/visvoai"
Changelog = "https://github.com/VisvoAI/visvoai/blob/main/visvoai-core/CHANGELOG.md"

[project.optional-dependencies]
# Durable SQLite conversation memory (AsyncSqliteSaver). The floor matters:
# older langgraph-checkpoint-sqlite releases predate the current
# langgraph-checkpoint interface, and installing newest-of-each can land on
# an incompatible pair — the extra makes pip enforce a compatible one.
sqlite = ["aiosqlite>=0.20", "langgraph-checkpoint-sqlite>=3.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
